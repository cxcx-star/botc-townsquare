<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>信息提示 · 血染钟楼</title>
<meta name="theme-color" content="#08070b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/xrh.css">
</head>
<body>

<button class="x-back" id="back" type="button" hidden>← 返回</button>

<header class="x-head">
  <h1>信息提示</h1>
  <p class="x-sub">点提示卡和角色，最后按「显示」递给玩家</p>
</header>

<div class="x-toolbar">
  <button class="x-rolebtn" id="roleBtn" type="button">
    <span class="x-rolebtn-icon">◈</span>
    <span>角色</span>
  </button>
  <button class="x-clear" id="btnClearTop" type="button">清空</button>
</div>

<main class="x-grid" id="grid"></main>

<div class="x-queue-wrap">
  <div class="x-queue" id="queue"></div>
</div>

<footer class="x-foot">
  <button class="x-showbar" id="btnShow" type="button" disabled>显示</button>
</footer>

<!-- 角色列表 -->
<section class="x-sheet" id="sheet" hidden>
  <div class="x-sheet-head">
    <input id="search" type="search" placeholder="搜索角色…" autocomplete="off">
    <button id="pickCancel" type="button">关闭</button>
  </div>
  <div class="x-roles" id="roles"></div>
</section>

<!-- 展示 -->
<section class="x-show" id="show" hidden>
  <div class="x-showlist" id="showList"></div>
  <div class="x-show-actions">
    <button class="x-show-btn" id="btnShowBack" type="button">返回</button>
    <button class="x-show-btn ghost" id="btnShowClear" type="button">清空</button>
  </div>
</section>

<script src="/js/xrh.js"></script>
</body>
</html>
